# TrueNAS custom app for toh-relay (Apps -> Discover Apps -> Install via YAML, name "toh-relay").
# The binary comes from `make relay` and lives in /mnt/Main/toh-relay on the NAS (change the
# path if your pool is not called Main).
# Host networking: the relay sees the players' real IPv4 and IPv6 addresses (rate limit, logs);
# a published port would hide IPv6 players behind Docker's proxy.
services:
  toh-relay:
    image: debian:stable-slim
    command: ["/relay/toh-relay", "--port", "41234"]
    network_mode: host
    user: "568:568"
    read_only: true
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: # strangers can make it log; keep at most 30 MB
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - /mnt/Main/toh-relay:/relay:ro
